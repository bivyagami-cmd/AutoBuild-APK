name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download ZIP project
        run: |
          echo "[INFO] Downloading project ZIP..."
          wget --header="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               --header="Accept: application/octet-stream" \
               -O project.zip \
               "${{ github.event.inputs.zip_url }}"
          echo "[SUCCESS] ZIP downloaded."

      - name: Extract ZIP
        run: |
          echo "[INFO] Extracting ZIP..."
          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "[ERROR] File bukan ZIP valid!"
            exit 1
          fi
          unzip -q project.zip -d project_raw
          echo "[SUCCESS] ZIP extracted."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Analyze Project Code
        working-directory: project_raw
        run: |
          echo "[INFO] Running flutter analyze..."
          flutter analyze > analyze_report.txt 2>&1 || true
          echo "[SUCCESS] Analysis done."
          rm -f analyze_report.txt

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "[SUCCESS] Analyze-only mode active."
          exit 0

      - name: Get dependencies
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: project_raw
        run: |
          echo "[INFO] Running flutter pub get..."
          flutter pub get
          echo "[SUCCESS] Dependencies resolved."

      - name: Build APK
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: project_raw
        run: |
          echo "[INFO] Building APK (release)..."
          flutter build apk --${{ github.event.inputs.build_type }}
          echo "[SUCCESS] APK Build complete."

      - name: Check APK Output
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        run: |
          echo "[INFO] Scanning for APK..."
          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "[ERROR] APK tidak ditemukan!"
            exit 1
          fi
          echo "[SUCCESS] APK found at: $APK_FOUND"
          echo "APK_PATH=$APK_FOUND" >> $GITHUB_ENV
          ls -lh "$APK_FOUND"

      - name: Upload APK artifact
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
